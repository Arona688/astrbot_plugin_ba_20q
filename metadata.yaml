name: astrbot_plugin_ba_20q
display_name: BA 猜学生
short_desc: 用是非题猜出你心里的碧蓝档案学生
desc: |-
  碧蓝档案主题的「二十问」猜谜。

  发送 `/ba猜学生` 开始：阿罗娜连续提问，你用「是 / 不是 / 不确定」按钮回答。
  最多 12 问，问满必须给出答案，不会继续追问。

  角色档案取自 SchaleDB：152 位学生的学校、社团、学年、年龄、武器、定位、
  站位与爱好。猜测前会校验是否与回答矛盾。
