short_desc: 用是非题猜出你心里的碧蓝档案学生
desc: |-
  碧蓝档案主题的「二十问」猜谜。

  发送 `/ba猜学生` 开始：先发一张 146 位原版角色的头像一览图，
  然后阿罗娜连续提问，最多 12 问猜出你心里的学生。

  QQ 官方机器人点按钮回答；NapCat 等平台直接回复「是 / 不是 / 放弃」。
  角色档案取自 SchaleDB，含学校、社团、武器、攻击类型、定位、站位、稀有度等。
